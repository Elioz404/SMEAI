# Vigilancia del sitio publicado. Va en su PROPIO workflow, no como paso final
# de `verify agents`, y esa separacion es el punto entero del fichero.
#
# Antes vivia al final de la ingesta. El 5 de septiembre esa ingesta se comio
# los 20 minutos de timeout contra un 8004scan que devolvia 500, la ejecucion
# se cancelo, y los pasos restantes se saltaron: la unica alarma capaz de
# avisar de que Vercel estaba caido fue justo lo que se perdio. Una alarma
# detras del proceso mas lento y mas fragil del repositorio no es una alarma.
#
# Aqui no depende de nada: no lee el registro, no necesita secretos y termina
# en segundos. Puede fallar por una sola razon, que es que el sitio no
# responda, y por eso su rojo significa algo.
#
# La misma comprobacion corre ademas como un job suelto dentro de verify.yml.
# No es redundancia por gusto: GitHub entrega los cron por aproximacion y el 6
# de septiembre dejo este workflow cuatro horas sin ejecutarse. Un fallo manda
# correo; una ejecucion que no ocurre no manda nada, y ese silencio es el peor
# de los estados posibles para la alarma que dice que la entrega sigue en pie.

name: site uptime

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/site.yml"
      - "scripts/site-check.mjs"

concurrency:
  group: site-uptime
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # La lista de rutas y los codigos esperados viven en el script, no aqui:
      # esta comprobacion se dispara desde dos workflows y tenerla escrita dos
      # veces garantizaba que un dia se separaran.
      - name: Check every published route
        run: node scripts/site-check.mjs
