# El "backend" de SMEAI. No hay servidor encendido ni base de datos: este job
# vuelve a llamar a todos los agentes, escribe data/snapshot.json y lo commitea.
#
# Efecto secundario deliberado: el historial de verificaciones queda versionado en
# git, asi que cualquiera puede auditar que afirmamos y cuando. Eso es lo que
# convierte "este agente responde" en una prueba y no en una promesa.
#
# Coste: 0 EUR. Actions es gratis e ilimitado en repositorios publicos.

name: verify agents

on:
  schedule:
    # Pedimos cada 30 minutos y GitHub concede muchas menos: medidas sobre las
    # veinte ultimas pasadas programadas, 7,4 al dia, con huecos de 2 a 5 horas
    # (mediana 3,3). Es lo normal en repos publicos y no se puede forzar desde
    # aqui. Se deja en 30 para tomar todas las que den.
    #
    # El motivo original de no bajar a 15 minutos era el limite de 100 deploys
    # diarios del plan Hobby de Vercel. Con la cadencia real ese techo queda
    # lejos y ha dejado de ser el factor que decide.
    #
    # Nada de esto degrada el dato: cada cifra publicada lleva la marca de
    # tiempo de la pasada que la produjo, asi que se lee cuando se midio.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/verify.yml"

concurrency:
  group: verify-agents
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    # Este techo tiene que quedar por ENCIMA de la suma de los topes de los
    # pasos, y esa es toda su logica.
    #
    # Sondeo 22 + censo 25 + el resto son unos 48 minutos en el peor caso. La
    # diferencia importa: cuando un PASO agota su tope, falla y la pasada
    # continua hasta el commit; cuando lo agota el JOB, se cancela entero y se
    # pierden los datos de cadena que ya estaban leidos. El 5 de septiembre eso
    # costo veintiuna horas sin un solo commit, asi que el techo del job se
    # pone donde no se pueda alcanzar por acumulacion.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Va ANTES de la ingesta, y el orden importa.
      #
      # La ingesta lee del registro ERC-8004 los agentes de referencia que
      # publicamos nosotros, y para eso necesita el SDK. Instalando despues,
      # ese import fallaria en cada pasada y nuestros propios agentes
      # desaparecerian del catalogo sin que nada se pusiera rojo.
      #
      # Sigue con continue-on-error porque nada de lo critico depende de el:
      # el catalogo de terceros se construye con fetch y modulos locales, y si
      # el SDK falta la ingesta lo dice y sigue. Lo que se pierde es listar lo
      # nuestro y leer el escrow, no la verificacion.
      #
      # El repo trae pnpm-lock.yaml y package.json declara pnpm@10.28.0, asi
      # que corepack usa esa version exacta. Solo dependencias de produccion:
      # hace falta @altananetwork/sdk y viem, no el tooling de build.
      - name: Install deps for the on-chain reads
        continue-on-error: true
        run: |
          corepack enable
          pnpm install --prod --frozen-lockfile

      # `continue-on-error` NO significa que de igual si falla: la ultima etapa
      # del workflow pone la ejecucion en rojo si esta no salio bien. Significa
      # que su fallo no puede llevarse por delante a los pasos siguientes.
      #
      # El 5 de septiembre esa diferencia costo un dia entero de datos. Con
      # 8004scan degradado la ingesta agotaba el timeout, se cancelaba, y
      # arrastraba consigo la lectura del escrow y el commit — que no dependen
      # de 8004scan para nada. Resultado: ni catalogo ni datos de cadena, y el
      # repositorio sin un solo commit en veintiuna horas.
      - name: Probe every listed agent
        id: probe
        continue-on-error: true
        env:
          # Direccion desde la que publicamos nuestro agente de referencia.
          # Es publica a proposito y no es un secreto: la ingesta la usa para
          # marcar como propios los agentes de ese dueno y EXCLUIRLOS de todas
          # las cifras. Si algun dia publicamos otro, no hay nada que tocar.
          SMEAI_OWNER_ADDRESS: "0x4Cda2a93054F2Ab639b4A95C261874a77A0Af6FA"
          # Opcional. Sin key el script se autolimita a 30 req/min y tarda mas,
          # pero funciona igual: no hay ninguna dependencia de pago.
          SCAN_API_KEY: ${{ secrets.SCAN_API_KEY }}
        run: node scripts/ingest.mjs

      # El estado del escrow se lee del kernel ERC-8183, contra el RPC de BSC.
      # No toca 8004scan, asi que sigue funcionando cuando el catalogo no
      # puede: es lo que mantiene el repositorio vivo durante una caida del
      # indexador. Con continue-on-error porque el script conserva el jobs.json
      # anterior antes que publicar una version degradada.
      #
      # No necesita ningun secreto: la direccion del comprador es publica y la
      # toma del propio data/jobs.json.
      - name: Read what happened to the jobs we funded
        continue-on-error: true
        run: node scripts/jobs.mjs

      # El censo se rehace una vez al dia; el propio script lo decide leyendo
      # el `generated_at` del JSON anterior, asi que aqui no hay condicion que
      # mantener sincronizada con el cron.
      # El censo no tiene tope de reloj propio, solo timeouts por peticion, y
      # con el upstream lento se fue a 18,1 minutos el 5 de septiembre. El tope
      # va aqui y no dentro del script porque lo que hay que acotar no es el
      # muestreo sino el paso: si se pasa, se corta y la pasada sigue. Con
      # continue-on-error, cortarlo no se lleva por delante el commit.
      - name: Sample the wider registry (about once a day)
        continue-on-error: true
        timeout-minutes: 25
        env:
          SCAN_API_KEY: ${{ secrets.SCAN_API_KEY }}
        run: node scripts/census.mjs

      # Se commitea SIEMPRE que algo haya cambiado, aunque la ingesta no haya
      # podido refrescar el catalogo: jobs.json viene de la cadena y no tiene
      # por que perderse porque un tercero este caido.
      - name: Commit snapshot if it changed
        run: |
          git config user.name "smeai-bot"
          git config user.email "actions@github.com"
          git add data/snapshot.json data/history.json data/jobs.json data/census.json
          if git diff --staged --quiet; then
            echo "no change in this run"
            exit 0
          fi
          git commit -m "verify: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # El push compite con los commits a mano del repo. Dos pasadas del 2
          # de septiembre murieron justo aqui por non-fast-forward y perdieron
          # su snapshot. Rebasar y reintentar cuesta tres lineas; el snapshot
          # son datos anadidos, no un cambio en conflicto.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rechazado (intento $i); rebase sobre origin/main y reintento"
            git pull --rebase --autostash origin main || break
          done
          echo "no se pudo publicar el snapshot tras tres intentos"
          exit 1

      # El color de la ejecucion lo decide el catalogo, y va al final para que
      # todo lo demas se haya guardado antes de que esto la tumbe. Sin este
      # paso, `continue-on-error` en la ingesta dejaria las pasadas en verde y
      # una caida prolongada del indexador pasaria desapercibida durante la
      # evaluacion, que es cuando menos podemos permitirnoslo.
      - name: Fail if the catalogue could not refresh
        if: steps.probe.outcome == 'failure'
        run: |
          echo "La ingesta no pudo refrescar el catalogo."
          echo "El snapshot anterior se conserva intacto y los datos de cadena si se han guardado."
          echo "Causa habitual: 8004scan degradado. Revisa el log del paso 'Probe every listed agent'."
          exit 1

  # Segundo disparador de la comprobacion del sitio, deliberadamente duplicado.
  #
  # Es un JOB aparte y sin `needs`: corre en paralelo al de la ingesta y no le
  # afecta que aquel agote su timeout. Esa independencia es la razon de que este
  # aqui y no como un paso mas.
  #
  # Y esta duplicado porque el 6 de septiembre el workflow site.yml paso cuatro
  # horas sin ejecutarse mientras este corria dos veces: GitHub entrega los cron
  # cuando puede. Dos disparadores distintos para una comprobacion que dura doce
  # segundos es un seguro barato sobre la unica alarma que importa durante la
  # evaluacion.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # La lista de rutas y los codigos esperados viven en el script, no aqui:
      # esta comprobacion se dispara desde dos workflows y tenerla escrita dos
      # veces garantizaba que un dia se separaran.
      - name: Check every published route
        run: node scripts/site-check.mjs
